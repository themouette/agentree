[package]
name = "agentree"
version = "0.1.0"
edition = "2021"
authors = ["Agentree Contributors"]
description = "Workspace orchestration CLI with pluggable isolation backends"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive", "env", "suggestions"] }
toml = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
which = "8.0"
chrono = "0.4"
wait-timeout = "0.2"
dirs = "6.0"
once_cell = "1.19"
semver = "1.0.27"
strsim = "0.11"
self_update = { version = "0.42", default-features = false, features = ["archive-tar", "compression-flate2", "rustls"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
serial_test = "3.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
